name: AI assistant - CI CD

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Cài đặt AI Tool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --force-reinstall git+https://github.com/4maths/ai-cicd-assistant.git

      # =========================
      # Lấy diff
      # =========================
      - name: 3. Lấy dữ liệu Diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p payload

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            aicicd fetch \
              --source github \
              --repo "${{ github.repository }}" \
              --pr "${{ github.event.pull_request.number }}" \
              --out-dir ./payload
          else
            git diff HEAD~1 > ./payload/diff.txt
            echo "{}" > ./payload/metadata.json
          fi

      # =========================
      # Security scan
      # =========================
      - name: 4. Security Scan
        run: |
          aicicd security-scan \
            --input ./payload/diff.txt \
            --metadata ./payload/metadata.json \
            --format markdown \
            --output security.md || true

      # =========================
      # AI Review (FPT LLM)
      # =========================
      - name: 5. AI PR Review
        run: |
          aicicd pr-review \
            --input ./payload/diff.txt \
            --format markdown \
            --output review.md \
            --provider fpt || true

      # =========================
      # Comment lên PR (nếu có PR)
      # =========================
      - name: 6. Publish PR Comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f security.md ] && aicicd publish --platform github --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}" --file security.md
          [ -f review.md ] && aicicd publish --platform github --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}" --file review.md

      # =========================
      # =========================
      - name: 7. Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-report
          path: |
            review.md
            security.md