name: AI assistant - CI CD (Groq Intelligence)

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Cài đặt AI Tool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --force-reinstall git+https://github.com/4maths/ai-cicd-assistant.git

      # =========================
      # Lấy dữ liệu thay đổi (Diff)
      # =========================
      - name: 3. Lấy dữ liệu thay đổi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p payload
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Sử dụng GitHub API thông minh (đã được fix lỗi Empty Diff)
            aicicd fetch \
              --source github \
              --repo "${{ github.repository }}" \
              --pr "${{ github.event.pull_request.number }}" \
              --out-dir ./payload
          else
            # Lấy diff của commit cuối cùng cho các nhánh feature
            git diff HEAD~1 > ./payload/diff.txt
            echo "{}" > ./payload/metadata.json
          fi

      # =========================
      # Security Scan (Regex + Groq)
      # =========================
      - name: 4. Chạy Security Scan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          aicicd security-scan \
            --provider groq \
            --input ./payload/diff.txt \
            --metadata ./payload/metadata.json \
            --format markdown \
            --output security.md || true

      # =========================
      # AI PR Review (Groq)
      # =========================
      - name: 5. Chạy AI PR Review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          aicicd pr-review \
            --provider groq \
            --input ./payload/diff.txt \
            --format markdown \
            --output review.md || true

      # =========================
      # Đăng kết quả lên PR
      # =========================
      - name: 6. Đăng PR Comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f security.md ] && aicicd publish --platform github --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}" --file security.md
          [ -f review.md ] && aicicd publish --platform github --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}" --file review.md

      # =========================
      # Lưu trữ báo cáo (Artifacts)
      # =========================
      - name: 7. Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-report
          path: |
            review.md
            security.md
