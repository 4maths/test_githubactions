name: AI CI/CD & Deploy Guard Assistant

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai_cicd_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tool (Force Latest)
        run: |
          # Cài đặt trực tiếp từ GitHub để luôn lấy logic mới nhất của m
          pip install --upgrade --no-cache-dir git+https://github.com/4maths/ai-cicd-assistant.git

      - name: Run AI Analysis & Deploy Check
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Thay URL này bằng URL môi trường staging/dev thực tế của m nếu có
          DEPLOY_URL: "https://google.com" 
        run: |
          # 1. Lấy dữ liệu PR (Diff + Metadata)
          aicicd fetch --source github --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --out-dir ./payload
          
          # 2. Quét bảo mật (Security Scan)
          aicicd security-scan --input ./payload/diff.txt --metadata ./payload/metadata.json --format markdown --output security.md || true
          
          # 3. Review Code Logic
          aicicd pr-review --input ./payload/diff.txt --format markdown --output review.md || true
          
          # 4. Deploy Guard: AI truy cập URL và phán đoán sức khỏe hệ thống (Mới)
          aicicd deploy-guard --url "$DEPLOY_URL" --format markdown --output deploy_report.md || true
          
          # 5. Publish: Đăng tất cả kết quả lên PR Comment
          aicicd publish --platform github --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --file security.md
          aicicd publish --platform github --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --file review.md
          aicicd publish --platform github --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --file deploy_report.md