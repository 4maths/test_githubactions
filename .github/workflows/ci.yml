name: AI Assistant - PR Security & Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-assistant-check:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Cần thiết để lấy diff cục bộ

      - name: 2. Cài đặt AI Tool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade git+https://github.com/4maths/ai-cicd-assistant.git

      - name: 3. Lấy dữ liệu PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          aicicd fetch \
            --source github \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --out-dir ./payload

      - name: 4. Chạy Security Scanner (Regex + FPT LLM)
        run: |
          # Công cụ tự động chia nhỏ bản diff (chunking) để xử lý bản diff lớn
          aicicd security-scan \
            --provider fpt \
            --input ./payload/diff.txt \
            --metadata ./payload/metadata.json \
            --format markdown \
            --output security.md || true

      - name: 5. Chạy PR Review (FPT LLM)
        run: |
          aicicd pr-review \
            --provider fpt \
            --input ./payload/diff.txt \
            --format markdown \
            --output review.md || true

      - name: 6. Đăng báo cáo lên PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f security.md ] && aicicd publish --platform github --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}" --file security.md
          [ -f review.md ] && aicicd publish --platform github --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}" --file review.md
