name: AI Assistant Code Review
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tool (Force Latest)
        run: |
          # Cài đặt trực tiếp từ URL GitHub để ép lấy bản mới nhất, không dùng cache
          pip install --upgrade --no-cache-dir git+https://github.com/4maths/ai-cicd-assistant.git

      - name: Run AI Steps
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Lấy dữ liệu PR
          aicicd fetch --source github --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --out-dir ./payload
          
          # 2. Quét bảo mật (|| true để luôn chạy tiếp)
          aicicd security-scan --input ./payload/diff.txt --metadata ./payload/metadata.json --format markdown --output security.md || true
          
          # 3. Review Code (|| true để luôn chạy tiếp)
          aicicd pr-review --input ./payload/diff.txt --format markdown --output review.md ||
          
          # 4. Đăng kết quả lên PR
          aicicd publish --platform github --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --file security.md
          aicicd publish --platform github --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --file review.md
