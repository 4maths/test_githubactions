name: AI Assistant Code Review
on:
  pull_request:
    types: [opened, synchronize] # Chạy khi tạo mới hoặc update code trong PR

jobs:
  ai_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tool
        run: |
          # Clone tool từ repo (phiên bản ổn định)
          git clone https://github.com/4maths/ai-cicd-assistant.git
          cd ai-cicd-assistant
          pip install -e .

      - name: Run AI Steps
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Lấy diff
          aicicd fetch --source github --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --out-dir ./payload
          
          # 2. Quét (Dùng || true để không làm sập pipeline, giúp lệnh publish phía sau luôn chạy)
          aicicd security-scan --input ./payload/diff.txt --metadata ./payload/metadata.json --format markdown --output security.md || true
          aicicd pr-review --input ./payload/diff.txt --format markdown --output review.md || true
          
          # 3. Đăng comment lên GitHub
          aicicd publish --platform github --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --file security.md
          aicicd publish --platform github --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --file review.md
