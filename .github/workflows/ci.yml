name: AI CI/CD Assistant

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-analysis:
    name: AI Code Analysis & Security Scan
    # Chạy trên PR hoặc các nhánh feature đảm bảo chất lượng code trước khi merge
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quan trọng để git diff hoạt động chính xác

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install AI Assistant Tool
        run: |
          python -m pip install --upgrade pip
          # Cài đặt trực tiếp từ repo đã được refactor
          pip install git+https://github.com/4maths/ai-cicd-assistant.git

      - name: 4. Fetch Changeset (Diff)
        id: fetch_diff
        run: |
          mkdir -p .aicicd_payload
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            aicicd fetch \
              --source github \
              --repo "${{ github.repository }}" \
              --pr "${{ github.event.pull_request.number }}" \
              --out-dir .aicicd_payload
          else
            # Xử lý cho push lên branch feature (diff với bản build trước đó)
            git diff HEAD~1 > .aicicd_payload/diff.txt
            echo '{"source": "branch_push"}' > .aicicd_payload/metadata.json
          fi

      - name: 5. Security Analysis (Hybrid Scan)
        run: |
          # Dùng lệnh 'security' mới, output Markdown cho Publisher
          aicicd security \
            --input .aicicd_payload/diff.txt \
            --provider groq \
            --format markdown \
            --output security_report.md || echo "Security scan skipped or failed"

      - name: 6. AI Code Review
        run: |
          # Dùng lệnh 'review' mới
          aicicd review \
            --input .aicicd_payload/diff.txt \
            --provider groq \
            --format markdown \
            --output review_report.md || echo "AI Review skipped or failed"

      - name: 7. Publish Results to Pull Request
        if: github.event_name == 'pull_request'
        run: |
          # Đăng báo cáo bảo mật
          if [ -f security_report.md ]; then
            aicicd publish \
              --platform github \
              --repo "${{ github.repository }}" \
              --pr "${{ github.event.pull_request.number }}" \
              --file security_report.md
          fi
          
          # Đăng báo cáo Code Review
          if [ -f review_report.md ]; then
            aicicd publish \
              --platform github \
              --repo "${{ github.repository }}" \
              --pr "${{ github.event.pull_request.number }}" \
              --file review_report.md
          fi

      - name: 8. Archive Analysis Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis-reports
          path: |
            security_report.md
            review_report.md
          retention-days: 7
