name: AI Assistant Code Review
on:
  pull_request:
    types: [opened, synchronize] # Chạy khi tạo mới hoặc update code trong PR

jobs:
  ai_job:
    runs-on: ubuntu-latest
    # Cấp quyền để AI có thể viết comment vào PR
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Quan trọng: để AI so sánh được code cũ và mới

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tool
        run: pip install git+https://github.com/4maths/ai-cicd-assistant.git

      - name: Run AI Steps
        env:
          # Người dùng chỉ cần cài đặt 1 cái Secret duy nhất là GROQ_API_KEY
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Tự động có sẵn, không cần cài
        run: |
          # BƯỚC 1: Lấy dữ liệu PR (Tự động nhận diện Repo và PR Number)
          aicicd fetch --source github --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --out-dir ./payload
          
          # BƯỚC 2: Phân tích (Bạn có thể thêm/bớt các dòng này tùy nhu cầu)
          aicicd security-scan --input ./payload/diff.txt --metadata ./payload/metadata.json --format markdown --output security.md
          aicicd pr-review --input ./payload/diff.txt --format markdown --output review.md
          
          # BƯỚC 3: Đăng kết quả (Tự động đẩy lên đúng chỗ)
          aicicd publish --platform github --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --file security.md
          aicicd publish --platform github --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --file review.md
